      HERMES_BASE_PATH: ${HERMES_BASE_PATH}
      HERMES_DEVICE_PAIRING: ${HERMES_DEVICE_PAIRING}
      # Full section-level overrides for all Hermes config roots
      HERMES_META_JSON: ${HERMES_META_JSON:-}
      HERMES_ENV_JSON: ${HERMES_ENV_JSON:-}
      HERMES_WIZARD_JSON: ${HERMES_WIZARD_JSON:-}
      HERMES_DIAGNOSTICS_JSON: ${HERMES_DIAGNOSTICS_JSON:-}
      HERMES_LOGGING_JSON: ${HERMES_LOGGING_JSON:-}
      HERMES_CLI_JSON: ${HERMES_CLI_JSON:-}
      HERMES_UPDATE_JSON: ${HERMES_UPDATE_JSON:-}
      HERMES_BROWSER_JSON: ${HERMES_BROWSER_JSON:-}
      HERMES_UI_JSON: ${HERMES_UI_JSON:-}
      HERMES_SECRETS_JSON: ${HERMES_SECRETS_JSON:-}
      HERMES_AUTH_JSON: ${HERMES_AUTH_JSON:-}
      HERMES_ACP_JSON: ${HERMES_ACP_JSON:-}
      HERMES_MODELS_JSON: ${HERMES_MODELS_JSON:-}
      HERMES_NODE_HOST_JSON: ${HERMES_NODE_HOST_JSON:-}
      HERMES_AGENTS_JSON: ${HERMES_AGENTS_JSON:-}
      HERMES_TOOLS_JSON: ${HERMES_TOOLS_JSON:-}
      HERMES_BINDINGS_JSON: ${HERMES_BINDINGS_JSON:-}
      HERMES_BROADCAST_JSON: ${HERMES_BROADCAST_JSON:-}
      HERMES_AUDIO_JSON: ${HERMES_AUDIO_JSON:-}
      HERMES_MEDIA_JSON: ${HERMES_MEDIA_JSON:-}
      HERMES_MESSAGES_JSON: ${HERMES_MESSAGES_JSON:-}
      HERMES_COMMANDS_JSON: ${HERMES_COMMANDS_JSON:-}
      HERMES_APPROVALS_JSON: ${HERMES_APPROVALS_JSON:-}
      HERMES_SESSION_JSON: ${HERMES_SESSION_JSON:-}
      HERMES_CRON_JSON: ${HERMES_CRON_JSON:-}
      HERMES_HOOKS_JSON: ${HERMES_HOOKS_JSON:-}
      HERMES_WEB_JSON: ${HERMES_WEB_JSON:-}
      HERMES_CHANNELS_JSON: ${HERMES_CHANNELS_JSON:-}
      HERMES_DISCOVERY_JSON: ${HERMES_DISCOVERY_JSON:-}
      HERMES_CANVAS_HOST_JSON: ${HERMES_CANVAS_HOST_JSON:-}
      HERMES_TALK_JSON: ${HERMES_TALK_JSON:-}
      HERMES_GATEWAY_JSON: ${HERMES_GATEWAY_JSON:-}
