      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HERMES_WHISPER_API_KEY: ${HERMES_WHISPER_API_KEY:-}
      OVERWRITE_CONFIG: "true"
      HERMES_STATE_DIR: ${HERMES_STATE_DIR:-}
      # Feature enablement + API Keys
      HERMES_ELEVENLABS_API_KEY: ${HERMES_ELEVENLABS_API_KEY}
      HERMES_NOTION_API_KEY: ${HERMES_NOTION_API_KEY}
      HERMES_GITHUB_TOKEN: ${HERMES_GITHUB_TOKEN}
      HERMES_GITEA_HOST: ${HERMES_GITEA_HOST:-}
