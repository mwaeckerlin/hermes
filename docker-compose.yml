services:
  hermes-gateway:
    image: mwaeckerlin/hermes:gateway
    build:
      context: .
      dockerfile: Dockerfile.gateway
    depends_on:
      hermes-sandbox:
        condition: service_healthy
      allow-write-access:
        condition: service_started
    environment:
      # ── SSH key for sandbox (required) ─────────────────────────────────────
      HERMES_SANDBOX_SSH_PRIVATE_KEY:
      # ── Config control ─────────────────────────────────────────────────────
      # Unset/true overwrites config.yaml from the template on startup.
      # Set false to preserve manual edits in the hermes-data volume.
      OVERWRITE_CONFIG:
      # Override auto-selected default model (e.g. "anthropic/claude-opus-4.6")
      HERMES_DEFAULT_MODEL:
      # ── LLM providers (all optional, set one or more) ──────────────────────
      # OpenRouter: access to 300+ models via one key (recommended)
      OPENROUTER_API_KEY:
      # Direct provider keys (used when the corresponding provider is selected)
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      GOOGLE_API_KEY:
      GEMINI_API_KEY:
      # LiteLLM proxy (OpenAI-compatible custom endpoint, e.g. self-hosted models)
      LITELLM_BASE_URL:
      LITELLM_API_KEY:
      LITELLM_DEFAULT_MODEL:
      # ── Messaging channels (leave empty to disable) ─────────────────────────
      # Telegram: set TELEGRAM_BOT_TOKEN to enable. Get token from @BotFather.
      TELEGRAM_BOT_TOKEN:
      TELEGRAM_ALLOWED_USERS:
      TELEGRAM_HOME_CHANNEL:
      TELEGRAM_WEBHOOK_URL:
      TELEGRAM_WEBHOOK_PORT:
      TELEGRAM_WEBHOOK_SECRET:
      # WhatsApp: set WHATSAPP_ENABLED=true and run `hermes whatsapp` to pair.
      WHATSAPP_ENABLED:
      WHATSAPP_ALLOWED_USERS:
      # Discord: set DISCORD_BOT_TOKEN to enable.
      DISCORD_BOT_TOKEN:
      # Slack: set both SLACK_BOT_TOKEN and SLACK_APP_TOKEN to enable.
      SLACK_BOT_TOKEN:
      SLACK_APP_TOKEN:
      SLACK_ALLOWED_USERS:
      # Gateway-wide open access (unset = Hermes default applies; false = allowlist only)
      GATEWAY_ALLOW_ALL_USERS:
      # ── Tool API keys ────────────────────────────────────────────────────────
      # Voice transcription (Whisper) and OpenAI TTS
      # Defaults to OPENAI_API_KEY if unset (handled by entrypoint).
      VOICE_TOOLS_OPENAI_KEY:
      # Web search / content extraction
      EXA_API_KEY:
      FIRECRAWL_API_KEY:
      PARALLEL_API_KEY:
      TAVILY_API_KEY:
      # Image generation (fal.ai)
      FAL_KEY:
      # Nous Tool Gateway / Nous Portal managed tools (optional)
      TOOL_GATEWAY_DOMAIN:
      TOOL_GATEWAY_SCHEME:
      TOOL_GATEWAY_USER_TOKEN:
      FIRECRAWL_GATEWAY_URL:
      NOUS_BASE_URL:
      NOUS_INFERENCE_BASE_URL:
      HERMES_PORTAL_BASE_URL:
      HERMES_NOUS_MIN_KEY_TTL_SECONDS:
      HERMES_NOUS_TIMEOUT_SECONDS:
      # Browser automation (Browserbase cloud)
      BROWSERBASE_API_KEY:
      BROWSERBASE_PROJECT_ID:
      # ElevenLabs TTS
      ELEVENLABS_API_KEY:
      # GitHub (Skills Hub + higher API rate limits)
      GITHUB_TOKEN:
      # Groq (free-tier Whisper STT)
      GROQ_API_KEY:
      # ── config.yaml section overrides (JSON strings, JSON is valid YAML) ────
      # Replace entire config.yaml sections. Rarely needed — adjust individual
      # HERMES_* variables above first.
      HERMES_MODEL_YAML:
      HERMES_TERMINAL_YAML:
      HERMES_COMPRESSION_YAML:
      HERMES_AUXILIARY_YAML:
      HERMES_MEMORY_YAML:
      HERMES_SESSION_RESET_YAML:
      HERMES_STREAMING_YAML:
      HERMES_SKILLS_YAML:
      HERMES_AGENT_YAML:
      HERMES_APPROVALS_YAML:
      HERMES_PLATFORM_TOOLSETS_YAML:
      HERMES_STT_YAML:
      HERMES_TTS_YAML:
      HERMES_IMAGE_GEN_YAML:
      HERMES_TOOL_OUTPUT_YAML:
      HERMES_WEB_YAML:
      HERMES_BROWSER_YAML:
      HERMES_PRIVACY_YAML:
      HERMES_VOICE_YAML:
      HERMES_HUMAN_DELAY_YAML:
      HERMES_PROMPT_CACHING_YAML:
      HERMES_PROVIDER_ROUTING_YAML:
      HERMES_DELEGATION_YAML:
      HERMES_MCP_SERVERS_YAML:
      HERMES_DISPLAY_YAML:
      # ── Individual config.yaml setting overrides ────────────────────────────
      HERMES_MODEL_PROVIDER:
      HERMES_MODEL_BASE_URL:
      HERMES_MODEL_MAX_TOKENS:
      HERMES_MAX_TURNS:
      HERMES_GATEWAY_TIMEOUT:
      HERMES_GATEWAY_TIMEOUT_WARNING:
      HERMES_GATEWAY_DRAIN_TIMEOUT:
      HERMES_REASONING_EFFORT:
      HERMES_AGENT_VERBOSE:
      HERMES_APPROVALS_MODE:
      HERMES_APPROVALS_TIMEOUT:
      HERMES_COMPRESSION_ENABLED:
      HERMES_COMPRESSION_THRESHOLD:
      HERMES_COMPRESSION_TARGET_RATIO:
      HERMES_COMPRESSION_PROTECT_LAST_N:
      HERMES_MEMORY_ENABLED:
      HERMES_USER_PROFILE_ENABLED:
      HERMES_MEMORY_CHAR_LIMIT:
      HERMES_USER_CHAR_LIMIT:
      HERMES_MEMORY_NUDGE_INTERVAL:
      HERMES_MEMORY_FLUSH_MIN_TURNS:
      HERMES_SESSION_RESET_MODE:
      HERMES_SESSION_RESET_IDLE_MINUTES:
      HERMES_SESSION_RESET_AT_HOUR:
      HERMES_GROUP_SESSIONS_PER_USER:
      HERMES_STREAMING_ENABLED:
      HERMES_STREAMING_EDIT_INTERVAL:
      HERMES_STREAMING_BUFFER_THRESHOLD:
      HERMES_SKILLS_NUDGE_INTERVAL:
      HERMES_DELEGATION_MAX_ITERATIONS:
      HERMES_DELEGATION_MAX_CONCURRENT:
      HERMES_DELEGATION_MAX_SPAWN_DEPTH:
      HERMES_STT_ENABLED:
      HERMES_STT_LOCAL_MODEL:
      HERMES_STT_LOCAL_LANGUAGE:
      HERMES_TTS_ENABLED:
      HERMES_TTS_PROVIDER:
      HERMES_TTS_MODEL_OVERRIDES_ENABLED:
      HERMES_IMAGE_GEN_USE_GATEWAY:
      HERMES_IMAGE_GEN_MODEL:
      HERMES_VISION_PROVIDER:
      HERMES_VISION_MODEL:
      HERMES_WEB_EXTRACT_PROVIDER:
      HERMES_WEB_EXTRACT_MODEL:
      HERMES_FILE_READ_MAX_CHARS:
      HERMES_TOOL_OUTPUT_MAX_BYTES:
      HERMES_TOOL_OUTPUT_MAX_LINES:
      HERMES_TOOL_OUTPUT_MAX_LINE_LENGTH:
      HERMES_WEB_BACKEND:
      HERMES_BROWSER_INACTIVITY_TIMEOUT:
      HERMES_BROWSER_COMMAND_TIMEOUT:
      HERMES_BROWSER_CDP_URL:
      HERMES_PRIVACY_REDACT_PII:
      HERMES_VOICE_AUTO_TTS:
      HERMES_VOICE_MAX_RECORDING_SECONDS:
      HERMES_HUMAN_DELAY_MIN_MS:
      HERMES_HUMAN_DELAY_MAX_MS:
      HERMES_PROMPT_CACHING_TTL:
      HERMES_PROVIDER_ROUTING_SORT:
      HERMES_UNAUTHORIZED_DM_BEHAVIOR:
      HERMES_TIMEZONE:
      HERMES_DISPLAY_TOOL_PROGRESS:
      HERMES_DISPLAY_COMPACT:
      HERMES_DISPLAY_SKIN:
      HERMES_DISPLAY_INTERIM_MESSAGES:
      HERMES_DISPLAY_BG_NOTIFICATIONS:
      HERMES_DISPLAY_SHOW_REASONING:
      HERMES_DISPLAY_STREAMING:
      # ── SSH terminal settings (normally set via config.yaml.j2 defaults) ────
      # Override here only if connecting to a different sandbox.
      HERMES_TERMINAL_SSH_HOST:
      HERMES_TERMINAL_SSH_USER:
      HERMES_TERMINAL_SSH_PORT:
      HERMES_TERMINAL_TIMEOUT:
      HERMES_TERMINAL_LIFETIME:
      # ── Debug ────────────────────────────────────────────────────────────────
      WEB_TOOLS_DEBUG:
      VISION_TOOLS_DEBUG:
      HERMES_HUMAN_DELAY_MODE:
    volumes:
      - hermes-data:/opt/data
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - gateway-sandbox
      - dashboard-gateway

  hermes-dashboard:
    image: mwaeckerlin/hermes:dashboard
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command: ["dashboard", "--host", "0.0.0.0", "--insecure"]
    depends_on:
      hermes-gateway:
        condition: service_started
    environment:
      HERMES_HOME: /opt/data
      GATEWAY_HEALTH_URL: http://hermes-gateway:8642
    volumes:
      - hermes-data:/opt/data
    ports:
      - "9119:9119"
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - dashboard-gateway

  hermes-sandbox:
    image: mwaeckerlin/hermes:sandbox
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    environment:
      HERMES_SANDBOX_SSH_PUBLIC_KEY:
      DOCKER_HOST: tcp://hermes-dind:2375
    volumes:
      - hermes-workspace:/home/somebody
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      hermes-dind:
        condition: service_started
    restart: unless-stopped
    networks:
      - gateway-sandbox
      - sandbox-dind

  hermes-dind:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - hermes-docker:/var/lib/docker
    restart: unless-stopped
    networks:
      - sandbox-dind

  allow-write-access:
    image: mwaeckerlin/allow-write-access
    environment:
      ALLOW_USER: "chown -R 1000:1000"
    volumes:
      - hermes-data:/app

networks:
  gateway-sandbox:
    # For production Docker Swarm deployments, enable overlay encryption:
    # driver_opts:
    #   encrypted: "true"
  dashboard-gateway:
    # For production Docker Swarm deployments, enable overlay encryption:
    # driver_opts:
    #   encrypted: "true"
  sandbox-dind:

volumes:
  hermes-data:
  hermes-workspace:
  hermes-docker:
