      HERMES_MEDIA_AUDIO_PROVIDER: ${HERMES_MEDIA_AUDIO_PROVIDER:-}
      HERMES_MEDIA_AUDIO_MODEL: ${HERMES_MEDIA_AUDIO_MODEL:-}
      HERMES_TTS_AUTO: ${HERMES_TTS_AUTO:-}
      HERMES_TTS_PROVIDER: ${HERMES_TTS_PROVIDER:-}
      HERMES_TTS_MODEL_OVERRIDES_ENABLED: ${HERMES_TTS_MODEL_OVERRIDES_ENABLED:-}
      HERMES_MESSAGES_QUEUE_DEBOUNCE_MS: ${HERMES_MESSAGES_QUEUE_DEBOUNCE_MS:-}
      HERMES_MESSAGES_QUEUE_CAP: ${HERMES_MESSAGES_QUEUE_CAP:-}
      HERMES_COMMANDS_NATIVE: ${HERMES_COMMANDS_NATIVE:-}
      HERMES_COMMANDS_NATIVE_SKILLS: ${HERMES_COMMANDS_NATIVE_SKILLS:-}
      HERMES_COMMANDS_RESTART: ${HERMES_COMMANDS_RESTART:-}
      HERMES_COMMANDS_OWNER_DISPLAY: ${HERMES_COMMANDS_OWNER_DISPLAY:-}
      HERMES_HOOKS_INTERNAL_ENABLED: ${HERMES_HOOKS_INTERNAL_ENABLED:-}
      HERMES_HOOKS_COMMAND_LOGGER_ENABLED: ${HERMES_HOOKS_COMMAND_LOGGER_ENABLED:-}
      HERMES_HOOKS_SESSION_MEMORY_ENABLED: ${HERMES_HOOKS_SESSION_MEMORY_ENABLED:-}
      HERMES_HOOKS_BOOTSTRAP_EXTRA_FILES_ENABLED: ${HERMES_HOOKS_BOOTSTRAP_EXTRA_FILES_ENABLED:-}
      HERMES_HOOKS_BOOT_MD_ENABLED: ${HERMES_HOOKS_BOOT_MD_ENABLED:-}
      HERMES_TELEGRAM_DM_POLICY: ${HERMES_TELEGRAM_DM_POLICY:-}
      HERMES_TELEGRAM_ALLOW_FROM_JSON: ${HERMES_TELEGRAM_ALLOW_FROM_JSON:-}
      HERMES_TELEGRAM_GROUPS_JSON: ${HERMES_TELEGRAM_GROUPS_JSON:-}
      HERMES_TELEGRAM_GROUP_POLICY: ${HERMES_TELEGRAM_GROUP_POLICY:-}
      HERMES_TELEGRAM_STREAMING_MODE: ${HERMES_TELEGRAM_STREAMING_MODE:-}
      HERMES_DISCORD_DM_POLICY: ${HERMES_DISCORD_DM_POLICY:-}
      HERMES_DISCORD_ALLOW_FROM_JSON: ${HERMES_DISCORD_ALLOW_FROM_JSON:-}
      HERMES_DISCORD_STREAMING_MODE: ${HERMES_DISCORD_STREAMING_MODE:-}
      HERMES_SLACK_APP_TOKEN: ${HERMES_SLACK_APP_TOKEN:-}
      HERMES_SLACK_DM_POLICY: ${HERMES_SLACK_DM_POLICY:-}
      HERMES_SLACK_ALLOW_FROM_JSON: ${HERMES_SLACK_ALLOW_FROM_JSON:-}
      HERMES_SLACK_NATIVE_TRANSPORT: ${HERMES_SLACK_NATIVE_TRANSPORT:-}
