      HERMES_GITEA_INSECURE: ${HERMES_GITEA_INSECURE:-}
      HERMES_TRELLO_API_KEY: ${HERMES_TRELLO_API_KEY}
      HERMES_TELEGRAM_BOT_TOKEN: ${HERMES_TELEGRAM_BOT_TOKEN}
      HERMES_DISCORD_BOT_TOKEN: ${HERMES_DISCORD_BOT_TOKEN}
      HERMES_SLACK_BOT_TOKEN: ${HERMES_SLACK_BOT_TOKEN}
      HERMES_BRAVE_API_KEY: ${HERMES_BRAVE_API_KEY}
      # LiteLLM
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_URL: ${LITELLM_URL}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      # Agent defaults
      HERMES_PRIMARY_MODEL: ${HERMES_PRIMARY_MODEL:-openai/gpt-5.4}
      HERMES_AGENT_SCOPE: ${HERMES_AGENT_SCOPE}
      HERMES_DM_SCOPE: ${HERMES_DM_SCOPE}
      HERMES_SESSION_VISIBILITY: ${HERMES_SESSION_VISIBILITY}
      HERMES_SESSION_TOOLS_VISIBILITY: ${HERMES_SESSION_TOOLS_VISIBILITY}
      HERMES_HEARTBEAT_INTERVAL: ${HERMES_HEARTBEAT_INTERVAL}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS}
      HERMES_MAX_CONCURRENT: ${HERMES_MAX_CONCURRENT}
