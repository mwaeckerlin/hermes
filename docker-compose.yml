      HERMES_WHATSAPP_ENABLED: ${HERMES_WHATSAPP_ENABLED:-}
      HERMES_WHATSAPP_DM_POLICY: ${HERMES_WHATSAPP_DM_POLICY:-}
      HERMES_WHATSAPP_ALLOW_FROM_JSON: ${HERMES_WHATSAPP_ALLOW_FROM_JSON:-}
      HERMES_WHATSAPP_TEXT_CHUNK_LIMIT: ${HERMES_WHATSAPP_TEXT_CHUNK_LIMIT:-}
      HERMES_WHATSAPP_CHUNK_MODE: ${HERMES_WHATSAPP_CHUNK_MODE:-}
      HERMES_WHATSAPP_MEDIA_MAX_MB: ${HERMES_WHATSAPP_MEDIA_MAX_MB:-}
      HERMES_WHATSAPP_SEND_READ_RECEIPTS: ${HERMES_WHATSAPP_SEND_READ_RECEIPTS:-}
      HERMES_WHATSAPP_GROUPS_JSON: ${HERMES_WHATSAPP_GROUPS_JSON:-}
      HERMES_WHATSAPP_GROUP_POLICY: ${HERMES_WHATSAPP_GROUP_POLICY:-}
      HERMES_CHANNEL_DEFAULTS_JSON: ${HERMES_CHANNEL_DEFAULTS_JSON:-}
      HERMES_GOOGLECHAT_SERVICE_ACCOUNT_JSON: ${HERMES_GOOGLECHAT_SERVICE_ACCOUNT_JSON:-}
      HERMES_GOOGLECHAT_SERVICE_ACCOUNT_FILE: ${HERMES_GOOGLECHAT_SERVICE_ACCOUNT_FILE:-}
      HERMES_GOOGLECHAT_DM_ENABLED: ${HERMES_GOOGLECHAT_DM_ENABLED:-}
      HERMES_GOOGLECHAT_DM_POLICY: ${HERMES_GOOGLECHAT_DM_POLICY:-}
      HERMES_GOOGLECHAT_ALLOW_FROM_JSON: ${HERMES_GOOGLECHAT_ALLOW_FROM_JSON:-}
      HERMES_GOOGLECHAT_GROUP_POLICY: ${HERMES_GOOGLECHAT_GROUP_POLICY:-}
      HERMES_MATTERMOST_BOT_TOKEN: ${HERMES_MATTERMOST_BOT_TOKEN:-}
      HERMES_MATTERMOST_BASE_URL: ${HERMES_MATTERMOST_BASE_URL:-}
      HERMES_MATTERMOST_DM_POLICY: ${HERMES_MATTERMOST_DM_POLICY:-}
      HERMES_SIGNAL_ENABLED: ${HERMES_SIGNAL_ENABLED:-}
      HERMES_SIGNAL_ACCOUNT: ${HERMES_SIGNAL_ACCOUNT:-}
      HERMES_SIGNAL_DM_POLICY: ${HERMES_SIGNAL_DM_POLICY:-}
      HERMES_SIGNAL_ALLOW_FROM_JSON: ${HERMES_SIGNAL_ALLOW_FROM_JSON:-}
      HERMES_BLUEBUBBLES_DM_POLICY: ${HERMES_BLUEBUBBLES_DM_POLICY:-}
      HERMES_BLUEBUBBLES_SERVER_URL: ${HERMES_BLUEBUBBLES_SERVER_URL:-}
      HERMES_BLUEBUBBLES_PASSWORD: ${HERMES_BLUEBUBBLES_PASSWORD:-}
      HERMES_IMESSAGE_ENABLED: ${HERMES_IMESSAGE_ENABLED:-}
      HERMES_IMESSAGE_DM_POLICY: ${HERMES_IMESSAGE_DM_POLICY:-}
      HERMES_IMESSAGE_ALLOW_FROM_JSON: ${HERMES_IMESSAGE_ALLOW_FROM_JSON:-}
      HERMES_MATRIX_HOMESERVER: ${HERMES_MATRIX_HOMESERVER:-}
      HERMES_MATRIX_ACCESS_TOKEN: ${HERMES_MATRIX_ACCESS_TOKEN:-}
      HERMES_MSTEAMS_CONFIG_WRITES: ${HERMES_MSTEAMS_CONFIG_WRITES:-}
      HERMES_MSTEAMS_APP_ID: ${HERMES_MSTEAMS_APP_ID:-}
      HERMES_MSTEAMS_APP_PASSWORD: ${HERMES_MSTEAMS_APP_PASSWORD:-}
      HERMES_MSTEAMS_TENANT_ID: ${HERMES_MSTEAMS_TENANT_ID:-}
      HERMES_IRC_ENABLED: ${HERMES_IRC_ENABLED:-}
      HERMES_IRC_DM_POLICY: ${HERMES_IRC_DM_POLICY:-}
      HERMES_IRC_CONFIG_WRITES: ${HERMES_IRC_CONFIG_WRITES:-}
      HERMES_IRC_HOST: ${HERMES_IRC_HOST:-}
      HERMES_IRC_PORT: ${HERMES_IRC_PORT:-}
      HERMES_IRC_TLS: ${HERMES_IRC_TLS:-}
      HERMES_IRC_NICKSERV_ENABLED: ${HERMES_IRC_NICKSERV_ENABLED:-}
      HERMES_IRC_NICKSERV_SERVICE: ${HERMES_IRC_NICKSERV_SERVICE:-}
      HERMES_IRC_NICKSERV_PASSWORD: ${HERMES_IRC_NICKSERV_PASSWORD:-}
      HERMES_IRC_NICKSERV_REGISTER: ${HERMES_IRC_NICKSERV_REGISTER:-}
      HERMES_IRC_NICKSERV_REGISTER_EMAIL: ${HERMES_IRC_NICKSERV_REGISTER_EMAIL:-}
      HERMES_EXTRA_CHANNELS_JSON: ${HERMES_EXTRA_CHANNELS_JSON:-}
      HERMES_GATEWAY_MODE: ${HERMES_GATEWAY_MODE:-}
      HERMES_GATEWAY_BIND: ${HERMES_GATEWAY_BIND:-}
      HERMES_GATEWAY_INTERNAL_PORT: ${HERMES_GATEWAY_INTERNAL_PORT:-}
      HERMES_GATEWAY_AUTH_MODE: ${HERMES_GATEWAY_AUTH_MODE:-}
      HERMES_CONTROL_UI_ENABLED: ${HERMES_CONTROL_UI_ENABLED:-}
      HERMES_CONTROL_UI_ALLOW_HOST_HEADER_ORIGIN_FALLBACK: ${HERMES_CONTROL_UI_ALLOW_HOST_HEADER_ORIGIN_FALLBACK:-}
      HERMES_CONTROL_UI_ALLOW_INSECURE_AUTH: ${HERMES_CONTROL_UI_ALLOW_INSECURE_AUTH:-}
      HERMES_CONTROL_UI_DISABLE_DEVICE_AUTH: ${HERMES_CONTROL_UI_DISABLE_DEVICE_AUTH:-}
      HERMES_ALLOWED_ORIGINS_JSON: ${HERMES_ALLOWED_ORIGINS_JSON:-}
      HERMES_TAILSCALE_MODE: ${HERMES_TAILSCALE_MODE:-}
      HERMES_TAILSCALE_RESET_ON_EXIT: ${HERMES_TAILSCALE_RESET_ON_EXIT:-}
      HERMES_TRUSTED_PROXIES_JSON: ${HERMES_TRUSTED_PROXIES_JSON:-}
      HERMES_SKILLS_INSTALL_NODE_MANAGER: ${HERMES_SKILLS_INSTALL_NODE_MANAGER:-}
      HERMES_BRAVE_ENABLED: ${HERMES_BRAVE_ENABLED:-}
      HERMES_DUCKDUCKGO_ENABLED: ${HERMES_DUCKDUCKGO_ENABLED:-}
      HERMES_ACPX_ENABLED: ${HERMES_ACPX_ENABLED:-}
      HERMES_ACPX_GITHUB_COMMAND: ${HERMES_ACPX_GITHUB_COMMAND:-}
      HERMES_ACPX_GITHUB_ARGS_JSON: ${HERMES_ACPX_GITHUB_ARGS_JSON:-}
      HERMES_ACPX_GITEA_COMMAND: ${HERMES_ACPX_GITEA_COMMAND:-}
      HERMES_ACPX_GITEA_ARGS_JSON: ${HERMES_ACPX_GITEA_ARGS_JSON:-}
    volumes:
      - ${HERMES_CONFIG_DIR:-hermes-config}:/home/node/.hermes
    ports:
      - "${HERMES_GATEWAY_PORT:-18789}:18789"
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - gateway-sandbox
      - gateway-mcp-gateway

  hermes-sandbox:
    image: mwaeckerlin/hermes:sandbox
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    environment:
      HERMES_SANDBOX_SSH_PUBLIC_KEY: ${HERMES_SANDBOX_SSH_PUBLIC_KEY}
      DOCKER_HOST: tcp://hermes-dind:2375
      HERMES_MCP_GATEWAY_URL: http://hermes-mcp-gateway:4000
    volumes:
      - hermes-workspace:/home/somebody
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      hermes-dind:
        condition: service_started
    restart: unless-stopped
    networks:
      - gateway-sandbox
      - sandbox-dind
      - sandbox-mcp-gateway

  hermes-dind:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - hermes-docker:/var/lib/docker
    restart: unless-stopped
    networks:
      - sandbox-dind

  hermes-mcp-gateway:
    image: mwaeckerlin/hermes-mcp-gateway
    depends_on:
      hermes-gateway:
        condition: service_healthy
    environment:
      HERMES_GATEWAY_URL: http://hermes-gateway:18789
      HERMES_GATEWAY_TOKEN: ${HERMES_GATEWAY_TOKEN}
      HERMES_DEVICE_IDENTITY: ${HERMES_DEVICE_IDENTITY}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - gateway-mcp-gateway
      - sandbox-mcp-gateway

  allow-write-access:
    image: mwaeckerlin/allow-write-access
    environment:
      ALLOW_USER: "chown -R 1000:1000"
    volumes:
      - ${HERMES_CONFIG_DIR:-hermes-config}:/app

networks:
  gateway-sandbox:
  sandbox-dind:
  gateway-mcp-gateway:
  sandbox-mcp-gateway:

volumes:
  hermes-config:
  hermes-workspace:
  hermes-docker:
