      HERMES_PLUGIN_ENTRIES_JSON: ${HERMES_PLUGIN_ENTRIES_JSON:-}
      PLUGINS: ${PLUGINS:-}
      # Individual overrides for template defaults
      HERMES_LOGGING_LEVEL: ${HERMES_LOGGING_LEVEL:-}
      HERMES_AUTH_PROFILE_PROVIDER: ${HERMES_AUTH_PROFILE_PROVIDER:-}
      HERMES_AUTH_PROFILE_MODE: ${HERMES_AUTH_PROFILE_MODE:-}
      HERMES_MODELS_MODE: ${HERMES_MODELS_MODE:-}
      HERMES_LITELLM_API: ${HERMES_LITELLM_API:-}
      HERMES_LITELLM_MODELS_JSON: ${HERMES_LITELLM_MODELS_JSON:-}
      HERMES_OPENAI_BASE_URL: ${HERMES_OPENAI_BASE_URL:-}
      HERMES_OPENAI_MODELS_JSON: ${HERMES_OPENAI_MODELS_JSON:-}
      HERMES_AGENT_SANDBOX_MODE: ${HERMES_AGENT_SANDBOX_MODE:-}
      HERMES_AGENT_WORKSPACE_ACCESS: ${HERMES_AGENT_WORKSPACE_ACCESS:-}
      HERMES_AGENT_MODELS_JSON: ${HERMES_AGENT_MODELS_JSON:-}
      HERMES_SUBAGENT_TIMEOUT_SECONDS: ${HERMES_SUBAGENT_TIMEOUT_SECONDS:-}
      HERMES_SUBAGENT_MAX_CONCURRENT: ${HERMES_SUBAGENT_MAX_CONCURRENT:-}
      HERMES_TOOLS_FS_WORKSPACE_ONLY: ${HERMES_TOOLS_FS_WORKSPACE_ONLY:-}
      HERMES_LOOP_DETECTION_ENABLED: ${HERMES_LOOP_DETECTION_ENABLED:-}
      HERMES_LOOP_DETECTION_WARNING_THRESHOLD: ${HERMES_LOOP_DETECTION_WARNING_THRESHOLD:-}
